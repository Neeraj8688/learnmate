# Local development stack. Needs a .env next to this file:  Copy-Item .env.example .env
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]            # secrets stay in local .env, never baked into images
    environment:
      CHROMA_PERSIST_DIRECTORY: /data/chroma
      SQLITE_PATH: /data/learnmate.db
    volumes:
      - learnmate_data:/data    # persists accounts, vectors and quiz history locally
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000   # public URL only; never a secret
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  learnmate_data:
